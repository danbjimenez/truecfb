name: Refresh ratings

# Pulls the latest game results, re-runs every season with the frozen formula,
# and saves the new numbers to site/. The site republishes whenever site/ changes.
#
# Three updates a week, each with a backup run in case the first is early or GitHub skips it.
# A run that finds nothing new saves nothing. Times are UTC; US Eastern is 4 or 5 hours behind.
on:
  schedule:
    - cron: "17 10 * * 0"    # Sunday morning: the week's games are final
    - cron: "17 16 * * 0"    #   backup
    - cron: "17 21 * * 0"    # Sunday late afternoon US time: after the AP poll (and the final CFP ranking on selection day)
    - cron: "17 13 * * 1"    #   backup, Monday morning
    - cron: "17 3 * * 3"     # Tuesday night US time: after the CFP ranking
    - cron: "17 13 * * 3"    #   backup, Wednesday morning
    - cron: "47 10 * 12,1 *" # every morning in December and January: bowl and playoff games are played most days
  workflow_dispatch:          # the "Run workflow" button on the Actions tab

permissions:
  contents: write

# Shares a queue with the game-finals job, so the two never save over each other.
concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Download game files
        run: python src/fetch_data.py data/schedules data/espn

      - name: Download the AP and CFP rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/fetch_polls.py data/polls

      - name: Build the games table
        run: python src/build_games.py data/schedules data/espn data/games.csv data/latest_poll.json

      - name: Add same-day finals from CollegeFootballData
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/fill_live_finals.py data/games.csv data/latest_poll.json "$(python -c 'import datetime as d; t=d.date.today(); print(t.year if t.month >= 7 else t.year - 1)')"

      - name: Run every season
        run: python src/run_all.py data/games.csv src data/latest_poll.json site data/cfp_final.json data/polls

      - name: Flag changes to finished seasons
        run: |
          changed=$(git diff --name-only -- site | grep -E 'sched_20(1[4-9]|2[0-5])\.json' || true)
          if [ -n "$changed" ]; then
            echo "::warning::Source data for a finished season changed, so its published numbers moved: $changed"
          fi

      - name: Save the new numbers
        run: |
          git add site
          if [ -d data/polls ]; then git add data/polls; fi
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git config user.name "truecfb-refresh"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh ratings with the latest results"
            git pull -q --rebase origin main
            git push
          fi
