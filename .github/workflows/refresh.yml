name: Refresh ratings

# Pulls the latest game results, re-runs every season with the frozen formula,
# and saves the new numbers to site/. The site republishes whenever site/ changes.
on:
  schedule:
    - cron: "17 */2 * * *"   # every two hours
  workflow_dispatch:          # the "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Download game files
        run: python src/fetch_data.py data/schedules data/espn

      - name: Download the AP and CFP rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/fetch_polls.py data/polls

      - name: Build the games table
        run: python src/build_games.py data/schedules data/espn data/games.csv data/latest_poll.json

      - name: Run every season
        run: python src/run_all.py data/games.csv src data/latest_poll.json site data/cfp_final.json data/polls

      - name: Flag changes to finished seasons
        run: |
          changed=$(git diff --name-only -- site | grep -E 'sched_20(1[4-9]|2[0-5])\.json' || true)
          if [ -n "$changed" ]; then
            echo "::warning::Source data for a finished season changed, so its published numbers moved: $changed"
          fi

      - name: Save the new numbers
        run: |
          git add site
          if [ -d data/polls ]; then git add data/polls; fi
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git config user.name "truecfb-refresh"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh ratings with the latest results"
            git push
          fi
