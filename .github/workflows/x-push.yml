name: "Reply bot: set up push"

# Run by hand (Actions tab -> "Reply bot: set up push" -> Run workflow) once X_CLIENT_SECRET is saved in
# Cloudflare and the Worker has deployed. "setup" registers https://truecfb.com/hooks/x with X and
# subscribes it to mentions of @truecfb, so X pushes each one to the Worker the moment it happens
# (src/x_push.py, docs/REPLY-BOT.md). "status" shows what is registered; "remove" undoes it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "status, setup or remove"
        required: true
        default: "status"
        type: choice
        options: [status, setup, remove]

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - name: X push
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_USER_ID: ${{ vars.X_USER_ID }}
        run: python src/x_push.py "${{ inputs.action }}"
