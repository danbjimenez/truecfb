name: Post a reply

# Started by the Cloudflare Worker when Dan taps "Post reply" on a reply draft in Telegram. Posts the
# saved draft, exactly as the templates wrote it, as a reply to the post that tagged @truecfb. Never
# replies twice to one post. Does nothing unless the repo variable REPLIES_LIVE is "true".
on:
  workflow_dispatch:
    inputs:
      mention:
        description: "Id of the post that tagged @truecfb"
        required: true
      message_id:
        description: "Telegram message to reply to (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: post-reply
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Post
        env:
          MENTION: ${{ inputs.mention }}
          MESSAGE_ID: ${{ inputs.message_id }}
          REPLIES_LIVE: ${{ vars.REPLIES_LIVE }}
          X_USER_ID: ${{ vars.X_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/reply_bot.py post data/bot "$MENTION" "$MESSAGE_ID"

      - name: Record it
        if: always()
        env:
          MENTION: ${{ inputs.mention }}
        run: |
          git add data/bot/replies.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "truecfb-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Reply to $MENTION"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 5
          done
          echo "::error::could not record it after three tries"; exit 1
