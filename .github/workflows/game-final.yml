name: Game finals

# Started by the Cloudflare Worker when the live scoreboard shows a new final (it can also be started
# by hand from the Actions tab). Re-runs every season with the newest finals, saves the new numbers to
# site/, drafts a post for each new final, and sends the drafts to Telegram for approval.
# Nothing is posted to X here: a draft is posted only after Dan taps "Post to X" (post-to-x.yml).
on:
  workflow_dispatch:
    inputs:
      games:
        description: "Game ids that just went final, comma-separated (optional)"
        required: false
        default: ""

permissions:
  contents: write

# Shares a queue with the scheduled refresh, so the two never save over each other.
concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  finals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Season
        run: echo "SEASON=$(python -c 'import datetime as d; t=d.date.today(); print(t.year if t.month >= 7 else t.year - 1)')" >> "$GITHUB_ENV"

      # Past seasons' files do not change, so they are kept between runs; the current season is always fresh.
      - name: Reuse past seasons' game files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/schedules
            data/espn
          key: gamefiles-${{ github.run_id }}
          restore-keys: gamefiles-

      - name: Download game files
        run: |
          if [ -f data/schedules/cfb_schedules_2013.csv ] && [ -f data/espn/cfb_schedule_2013.parquet ]; then
            python src/fetch_data.py data/schedules data/espn "$SEASON" "$SEASON"
          else
            python src/fetch_data.py data/schedules data/espn
          fi

      - name: Build the games table
        run: python src/build_games.py data/schedules data/espn data/games.csv data/latest_poll.json

      - name: Add same-day finals from CollegeFootballData
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/fill_live_finals.py data/games.csv data/latest_poll.json "$SEASON"

      - name: Run every season
        run: python src/run_all.py data/games.csv src data/latest_poll.json site data/cfp_final.json data/polls

      - name: Draft posts for new finals
        env:
          GAMES: ${{ inputs.games }}
        run: python src/bot_drafts.py draft data/games.csv src "$SEASON" data/bot site "$GAMES"

      - name: Save the new numbers and drafts
        run: |
          git add site data/bot/drafts.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "truecfb-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Game finals: new ratings and drafts"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 5
          done
          echo "::error::could not save after three tries"; exit 1

      - name: Send the drafts to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/bot_drafts.py send data/bot
