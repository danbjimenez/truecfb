name: Reply drafts

# Started by the Cloudflare Worker when someone new has tagged @truecfb (it can also be started by hand
# from the Actions tab). Reads the new mentions, asks the model what each one asks, has it write each
# reply from a fact sheet of the engine's published numbers and checks every number in it
# (src/reply_writer.py; the fixed templates are the fallback), saves the drafts, and sends them to
# Telegram. Nothing is posted here: a reply goes out only after Dan taps "Post reply" (post-reply.yml),
# and only while the repo variable REPLIES_LIVE is "true". Plan: docs/REPLY-BOT.md.
on:
  workflow_dispatch:
    inputs:
      since_id:
        description: "Newest mention the Worker had seen handled (optional; the job uses its own record)"
        required: false
        default: ""

permissions:
  contents: write

# One run at a time. A waiting run that GitHub cancels loses nothing: the next run reads every
# mention newer than the last one handled.
concurrency:
  group: replies
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The newest main, not the commit at dispatch time: a queued run must see the drafts saved by the run before it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt -r requirements-reply.txt

      - name: Draft replies
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_USER_ID: ${{ vars.X_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          REPLY_PROVIDER: ${{ vars.REPLY_PROVIDER }}
          REPLY_MODEL: ${{ vars.REPLY_MODEL }}
          REPLY_WRITER: ${{ vars.REPLY_WRITER }}
          REPLIES_LIVE: ${{ vars.REPLIES_LIVE }}
        run: python src/reply_bot.py draft site data/bot "$RUNNER_TEMP/outbox.json"

      - name: Save the drafts
        run: |
          git add data/bot/replies.json data/bot/optout.json site/replies.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "truecfb-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Reply drafts"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 5
          done
          echo "::error::could not save after three tries"; exit 1

      - name: Send the drafts to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPLIES_LIVE: ${{ vars.REPLIES_LIVE }}
        run: python src/reply_bot.py send "$RUNNER_TEMP/outbox.json"
