name: "Reply bot: try the model"

# Run by hand (Actions tab -> "Reply bot: try the model" -> Run workflow). Sends the made-up mentions in
# data/bot/reply_samples.json through the model (it looks up what it needs and writes the checked reply)
# and shows, in the run's summary, whether each was answered or skipped as expected, the reply each would
# get, what it looked up, and the cost.
# Posts nothing, saves nothing. Uses the XAI_API_KEY and ANTHROPIC_API_KEY secrets; a model whose key
# is not saved is left out.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to try, space-separated: claude, grok, or provider:model"
        required: false
        default: "grok"
      set:
        description: "core (about 13 samples, about $0.15) or all (about 83, about $1)"
        required: false
        default: "core"
      from:
        description: "Start at the Nth sample of that set (optional)"
        required: false
        default: ""
      limit:
        description: "Stop after N samples (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt -r requirements-reply.txt

      - name: Try the model
        env:
          MODELS: ${{ inputs.models }}
          SAMPLE_SET: ${{ inputs.set }}
          SAMPLE_FROM: ${{ inputs.from }}
          SAMPLE_LIMIT: ${{ inputs.limit }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          read -ra WANT <<< "$MODELS"
          python src/reply_eval.py site data/bot/reply_samples.json "${WANT[@]}"
