name: "Reply bot: try the model"

# Run by hand (Actions tab -> "Reply bot: try the model" -> Run workflow). Sends the made-up mentions in
# data/bot/reply_samples.json through the model step and shows, in the run's summary, how many it read
# right, the reply each would get, and the cost. Posts nothing, saves nothing. Uses the
# ANTHROPIC_API_KEY and XAI_API_KEY secrets; a model whose key is not saved is left out.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to try, space-separated: claude, grok, or provider:model"
        required: false
        default: "claude claude:claude-haiku-5-5 grok"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt -r requirements-reply.txt

      - name: Try the model
        env:
          MODELS: ${{ inputs.models }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          read -ra WANT <<< "$MODELS"
          python src/reply_eval.py site data/bot/reply_samples.json "${WANT[@]}"
